apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nafets227-backup.fullname" . }}-backupplan
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nafets227-backup.labels" . | nindent 4 }}
data:
  {{/* jscpd:ignore-start */ -}}
  backup.plan.sh: |
    #!/usr/bin/env bash
    #
    # This Script is generated by helm.
    # Chart: {{ .Chart.Name }}
    # Release: {{ .Release.Name }}
    # set -euo pipefail # backup Script not ready to run with set -eu
    {{- range $job := .Values.nafets227Backup.backup }}
    {{- if $job.enabled }}

    echo "Running backup job: {{ default "backup" $job.name }}"
    {{- if eq $job.type "file" }}

    backup file \
    "{{ include "nafets227-backup.rsynclocation" $job.source }}" \
    {{- with $job.source.sshKeyFile -}}
    {{- printf "--srcsecret %s \\" . | trim | nindent 4 -}}
    {{- end }}
    "{{ include "nafets227-backup.rsynclocation" $job.destination }}" \
    {{- with $job.destination.sshKeyFile -}}
    {{- printf "--dstsecret %s \\" . | trim | nindent 4 -}}
    {{- end -}}
{{- include "nafets227-backup.globalcliopts" $job
        | trim | replace "\n" " \\\n" | nindent 4 }} \
    {{- with $job.options.rsync }}
    -- \
    {{- range $opt := . }}
    "{{ $opt }}" \
    {{- end }}

    {{- end }}
    {{- else if eq $job.type "imap" }}

    backup imap \
    "{{ $job.source.email }}" \
    "{{ $job.destination.path }}" \
    "{{ $job.source.host }}:{{ $job.source.port }}" \
    {{- with $job.source.passwordFile -}}
    {{- printf "--srcsecret %s \\" . | trim | nindent 4 -}}
    {{- end }}
{{- include "nafets227-backup.globalcliopts" $job
        | trim | replace "\n" " \\\n" | nindent 4 }}
    {{- else if eq $job.type "rclone2file" }}

    backup rclone2file \
    "{{ $job.source.remote }}:{{ $job.source.path }}" \
    "{{ $job.destination.path }}" \
    {{- with $job.source.configFile -}}
    {{- printf "--srcsecret %s \\" . | trim | nindent 4 -}}
    {{- end }}
{{- include "nafets227-backup.globalcliopts" $job
        | trim | replace "\n" " \\\n" | nindent 4 }} \
      {{- with $job.options.rclone }}
    -- \
    {{- range $opt := . }}
    "{{ $opt }}" \
    {{- end }}

    {{- end }}
    {{- else if eq $job.type "file2rclone" }}

    backup file2rclone \
    "{{ $job.source.path }}" \
    "{{ $job.destination.remote }}:{{ $job.destination.path }}" \
    {{- with $job.destination.configFile -}}
    {{- printf "--dstsecret %s \\" . | trim | nindent 4 -}}
    {{- end }}
{{- include "nafets227-backup.globalcliopts" $job
        | trim | replace "\n" " \\\n" | nindent 4 -}} \
    {{- with $job.options.rclone }}
    -- \
    {{- range $opt := . }}
    "{{ $opt }}" \
    {{- end }}

    {{- end }}
    {{- else }}
    {{- fail (printf "unsupported backup type %s in %s\n"
      $job.type $job.name) }}
    {{- end }}
    {{- end }}
    {{- end }}
  {{- /* jscpd:ignore-end */ -}}

apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nafets227-backup.fullname" . }}-test-dryrun"
  labels:
    {{- include "nafets227-backup.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.podAnnotations }}
    {{- toYamlPretty . | nindent 4 }}
    {{- end }}
spec:
  {{- include "nafets227-backup.podSpec"
    (dict
      "Values" .Values
      "Chart" .Chart
      "Release" .Release
      "dryRun" "1"
    )
    | nindent 2 }}
